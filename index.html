<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#26132f"><title>Raspadinha • Revelação do Bebê</title><style>:root{--night:#23122c;--panel:#41204d;--panel2:#281531;--pink:#ef9fc7;--gold:#ffd46f;--text:#fff8ef}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night)}body{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#754384 0,#432550 35%,#23122c 78%);overflow-x:hidden}.page{width:min(720px,100%);margin:auto;padding:6px 6px 28px}.shell{overflow:hidden;border-radius:30px;border:2px solid #704a7d;background:#281530;box-shadow:0 30px 95px #0008}.hero{position:relative;overflow:hidden;background:#3a2046}.hero img{display:block;width:100%;height:auto;animation:hero 7s ease-in-out infinite alternate}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:13%;background:linear-gradient(transparent,#392043)}.board{position:relative;z-index:3;margin:-3px 14px 18px;padding:20px 16px 22px;border-radius:28px;border:3px solid #7d568b;background:radial-gradient(circle at 50% 0,#aa74bf22,transparent 34%),linear-gradient(var(--panel),var(--panel2));box-shadow:0 16px 42px #0006}.board h1{margin:0;text-align:center;color:var(--text);font-size:clamp(19px,3.2vw,27px);line-height:1.24}.board p{margin:7px auto 17px;text-align:center;color:#dfcde4;font-weight:700;font-size:clamp(12px,2vw,15px)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;touch-action:none}.cell{position:relative;aspect-ratio:1;padding:0;overflow:hidden;border:3px solid #835d91;border-radius:18px;background:linear-gradient(145deg,#f6e4ef,#e8cfe0);box-shadow:0 7px 0 #190d20;cursor:crosshair}.bg{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fff9ee 0,#f6deeb 55%,#dfc3dc 100%)}.char{width:94%;height:94%;object-fit:contain;filter:drop-shadow(0 10px 9px #3e1c433d);transform:scale(1.02);transition:.4s}.cell.open .char{transform:scale(1)}.scratch{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none;transition:opacity .28s}.cell.open{outline:3px solid #efafd0;outline-offset:-3px}.cell.win{outline:5px solid var(--gold);outline-offset:-5px;filter:drop-shadow(0 0 13px #ffd46fa8);animation:pulse .7s ease-in-out infinite alternate}.status{min-height:24px;margin-top:15px;text-align:center;color:#ffe8c0;font-weight:900}.hint{margin-top:4px;text-align:center;color:#cbb6d2;font-size:12px;font-weight:700}.decor{display:flex;justify-content:space-around;padding:0 20px 18px;font-size:clamp(35px,8vw,62px);background:linear-gradient(#35203f,#28172f)}.decor span{animation:float 3.4s ease-in-out infinite}.reveal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:18px;background:#1c0d22ef;backdrop-filter:blur(12px)}.reveal.show{display:grid}.card{width:min(540px,94vw);text-align:center;padding:24px 18px 25px;border-radius:30px;border:4px solid #efafd0;background:radial-gradient(circle at 50% 4%,#fff9ec,#f7dbe9 73%);box-shadow:0 30px 100px #0008;animation:pop .65s cubic-bezier(.16,.9,.24,1.18)}.tag{display:inline-block;padding:8px 17px;border-radius:14px;background:#8f5eaa;color:#fff8ee;font-weight:900}.card h2{margin:11px 0 9px;font-family:Georgia,serif;font-size:clamp(48px,10vw,82px);line-height:.94;color:#de72a7;text-shadow:0 3px white}.girl{width:min(250px,66vw);height:260px;object-fit:contain;filter:drop-shadow(0 12px 14px #5e295b40);animation:girl 2.8s ease-in-out infinite}.msg{margin-top:8px;color:#4e3158;font-size:clamp(19px,4vw,28px);font-weight:900}.sub{max-width:430px;margin:7px auto;color:#765c7d;font-weight:700;line-height:1.42}.close{margin-top:16px;border:0;border-radius:14px;padding:11px 18px;background:#8f5eaa;color:white;font-weight:900}.conf{position:fixed;top:-18px;width:9px;height:15px;border-radius:4px;z-index:120;pointer-events:none;animation:fall var(--d) linear forwards}@keyframes hero{to{transform:scale(1.015) translateY(-3px)}}@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}@keyframes pulse{to{transform:scale(1.035)}}@keyframes pop{from{opacity:0;transform:scale(.72) translateY(15px)}}@keyframes girl{50%{transform:translateY(-8px) rotate(-1deg)}}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(680deg);opacity:.15}}@media(max-width:560px){.page{padding:3px}.shell{border-radius:20px}.board{margin:-2px 5px 10px;padding:13px 9px 17px;border-radius:20px}.grid{gap:6px}.cell{border-radius:13px;border-width:2px}}</style></head><body><main class="page"><section class="shell"><header class="hero"><img id="heroArt" alt="Halloween Baby"></header><section class="board"><h1>✨ Raspe os 9 espaços e encontre 3 iguais em linha ✨</h1><p>Vale linha, coluna ou diagonal. A surpresa só aparece quando a combinação mágica for completada.</p><div class="grid" id="grid"></div><div class="status" id="status">Nenhum espaço revelado ainda</div><div class="hint">☝️ Arraste o dedo ou o mouse sobre os quadrinhos.</div></section><div class="decor"><span>🎃</span><span>👻</span><span>🕷️</span><span>🦇</span></div></section></main><section class="reveal" id="reveal"></section><script>(async()=>{const hero=document.getElementById('heroArt');try{const p=await Promise.all([0,1].map(i=>fetch(`assets/v2-hero-${i}.txt?v=3`,{cache:'no-store'}).then(r=>r.text())));hero.src='data:image/webp;base64,'+p.map(x=>x.trim()).join('')}catch(e){hero.style.display='none'}const pattern=['girl','boy','boy','boy','girl','boy','boy','boy','girl'],grid=document.getElementById('grid'),status=document.getElementById('status');pattern.forEach((sex,i)=>{const c=document.createElement('button');c.className='cell';c.dataset.i=i;c.dataset.sex=sex;c.innerHTML=`<div class="bg"><img class="char" src="assets/v2-${sex}.webp?v=3" alt="${sex==='girl'?'Bruxinha':'Bruxinho'}"></div><canvas class="scratch"></canvas>`;grid.appendChild(c)});const cells=[...document.querySelectorAll('.cell')],wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],opened=new Set();let down=false,done=false;function paint(c){const v=c.querySelector('canvas'),r=v.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));v.width=r.width*d;v.height=r.height*d;v.dataset.w=r.width;const x=v.getContext('2d');x.setTransform(d,0,0,d,0,0);const g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#dadbde');g.addColorStop(.48,'#afb2b7');g.addColorStop(1,'#d8dade');x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.globalAlpha=.17;x.fillStyle='#fff';for(let y=8;y<r.height;y+=17)for(let z=8;z<r.width;z+=19){x.beginPath();x.arc(z,y,1.6,0,Math.PI*2);x.fill()}x.globalAlpha=1}function erase(c,X,Y){if(!c||done||c.classList.contains('open'))return;const v=c.querySelector('canvas'),r=v.getBoundingClientRect(),x=X-r.left,y=Y-r.top;if(x<0||y<0||x>r.width||y>r.height)return;const q=v.getContext('2d'),d=v.width/+v.dataset.w;q.save();q.setTransform(d,0,0,d,0,0);q.globalCompositeOperation='destination-out';q.beginPath();q.arc(x,y,Math.max(18,r.width*.19),0,Math.PI*2);q.fill();q.restore()}function ratio(c){const v=c.querySelector('canvas'),a=v.getContext('2d').getImageData(0,0,v.width,v.height).data;let q=0,t=0;for(let i=3;i<a.length;i+=32){t++;if(a[i]<65)q++}return q/t}function open(c){const i=+c.dataset.i;if(opened.has(i)||ratio(c)<.47)return;opened.add(i);c.classList.add('open');const v=c.querySelector('canvas');v.style.opacity=0;v.style.pointerEvents='none';status.textContent=opened.size+(opened.size===1?' espaço revelado':' espaços revelados');check()}function check(){for(const l of wins){if(!l.every(i=>opened.has(i)))continue;const s=cells[l[0]].dataset.sex;if(s==='girl'&&l.every(i=>cells[i].dataset.sex===s)){l.forEach(i=>cells[i].classList.add('win'));done=true;status.textContent='✨ A linha mágica apareceu!';setTimeout(show,650);return}}}function at(x,y){const e=document.elementFromPoint(x,y);return e&&e.closest('.cell')}grid.onpointerdown=e=>{if(done)return;down=true;try{grid.setPointerCapture(e.pointerId)}catch{}erase(at(e.clientX,e.clientY),e.clientX,e.clientY);e.preventDefault()};grid.onpointermove=e=>{if(down&&!done){erase(at(e.clientX,e.clientY),e.clientX,e.clientY);e.preventDefault()}};function stop(){if(!down)return;down=false;cells.forEach(open)}grid.onpointerup=stop;grid.onpointercancel=stop;function show(){const r=document.getElementById('reveal');r.innerHTML=`<div class="card"><div class="tag">✨ O FEITIÇO REVELOU! ✨</div><h2>É MENINA! 💗</h2><img class="girl" src="assets/v2-girl.webp?v=3"><div class="msg">Nossa pequena bruxinha está a caminho! 🧙‍♀️</div><div class="sub">Três bruxinhas completaram a linha mágica. Preparem as abóboras, os feitiços e muito amor! 🎃✨</div><button class="close" id="close">Ver o tabuleiro</button></div>`;r.classList.add('show');document.getElementById('close').onclick=()=>r.classList.remove('show');const colors=['#ef9fc6','#ffd36e','#a875bd','#f39a4b','#fff'];for(let i=0;i<70;i++){const n=document.createElement('i');n.className='conf';n.style.left=Math.random()*100+'vw';n.style.background=colors[i%colors.length];n.style.setProperty('--x',(Math.random()-.5)*220+'px');n.style.setProperty('--d',(2+Math.random()*1.8)+'s');document.body.appendChild(n);setTimeout(()=>n.remove(),4200)}}cells.forEach(paint);addEventListener('resize',()=>cells.forEach(c=>{if(!c.classList.contains('open'))paint(c)}))})();</script></body></html>
