<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b1938"><title>Raspadinha • Revelação do Bebê</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#211329}body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#9e6ab344,transparent 24%),linear-gradient(#3c2148,#211329);overflow-x:hidden}.page{width:min(582px,100%);margin:auto;padding:4px}.poster{position:relative;width:100%;aspect-ratio:582/614;overflow:hidden;border:2px solid #3e2449;border-radius:22px;background:url('assets/reference.jpg') center/100% 100% no-repeat;box-shadow:0 24px 70px #0008}.poster:after{content:"";position:absolute;inset:6px;border:2px dashed #a478ae66;border-radius:16px;pointer-events:none;z-index:40}.grid{position:absolute;left:21.5%;top:49.85%;width:57.2%;display:grid;grid-template-columns:repeat(3,1fr);gap:2.7%;z-index:20;touch-action:none}.cell{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:10%;overflow:hidden;background:#d2d3d4;box-shadow:0 2px 5px #0005;cursor:crosshair}.char{position:absolute;inset:0;background:url('assets/reference.jpg') no-repeat;background-size:310% auto;transition:transform .35s}.char.girl{background-position:1% 8%}.char.boy{background-position:99% 8%}.scratch{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none}.cell.open{outline:3px solid #ffd36e;outline-offset:-3px}.cell.win{outline:4px solid #ffd36e;outline-offset:-4px;animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.03)}}.bat{position:absolute;z-index:10;font-size:18px;animation:fly 4s ease-in-out infinite alternate;pointer-events:none}.b1{left:3%;top:56%}.b2{right:4%;top:69%;animation-delay:-1.4s}@keyframes fly{to{transform:translate(10px,-7px) rotate(6deg)}}.reveal{position:fixed;inset:0;display:none;place-items:center;padding:18px;z-index:100;background:#211329ed;backdrop-filter:blur(8px)}.reveal.show{display:grid}.card{width:min(520px,94vw);text-align:center;padding:22px 16px 24px;border-radius:28px;border:4px solid #9d72ad;background:radial-gradient(circle at 50% 8%,#fff8e8,#f6dfcf 70%);box-shadow:0 28px 90px #0008;animation:pop .65s cubic-bezier(.16,.9,.24,1.18)}@keyframes pop{from{opacity:0;transform:scale(.74)}}.tag{display:inline-block;padding:8px 16px;border-radius:13px;background:#925eaa;color:#fff;font-weight:900}.card h1{margin:12px 0 9px;color:#6db7e8;font-size:clamp(44px,10vw,76px);line-height:.95}.result{width:min(230px,64vw);aspect-ratio:1;margin:auto;border-radius:24px;border:5px solid #94cbee;background:url('assets/reference.jpg') 99% 8%/310% auto no-repeat}.msg{margin-top:10px;color:#4c3157;font-size:clamp(18px,4vw,26px);font-weight:900}.sub{max-width:410px;margin:7px auto;color:#735b7b;font-weight:700}.close{margin-top:15px;border:0;border-radius:13px;padding:10px 16px;background:#ee9b46;color:#45264c;font-weight:900}.conf{position:fixed;top:-15px;width:8px;height:14px;border-radius:3px;z-index:120;animation:fall var(--d) linear forwards}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(600deg);opacity:.2}}@media(max-width:560px){.page{padding:2px}.poster{border-radius:16px}.grid{gap:2.5%}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="page"><section class="poster"><span class="bat b1">🦇</span><span class="bat b2">🦇</span><div class="grid" id="grid"></div></section></main><section class="reveal" id="reveal"><div class="card"><div class="tag">✨ O FEITIÇO REVELOU! ✨</div><h1>É UM MENINO! 💙</h1><div class="result"></div><div class="msg">Nosso pequeno bruxinho está a caminho! 🧙‍♂️</div><div class="sub">Vocês encontraram três bruxinhos na linha mágica. Agora o segredo está revelado! 🎃✨</div><button class="close" id="close">Ver o tabuleiro</button></div></section><script>const p=['boy','girl','girl','girl','boy','girl','girl','boy','boy'],g=document.querySelector('#grid'),r=document.querySelector('#reveal'),cl=document.querySelector('#close');p.forEach((s,i)=>{let b=document.createElement('button');b.className='cell';b.dataset.i=i;b.dataset.s=s;b.innerHTML=`<div class="char ${s}"></div><canvas class="scratch"></canvas>`;g.appendChild(b)});const c=[...document.querySelectorAll('.cell')],w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],o=new Set();let down=false,done=false;function paint(e){const v=e.querySelector('canvas'),q=e.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));v.width=q.width*d;v.height=q.height*d;v.dataset.w=q.width;const x=v.getContext('2d');x.setTransform(d,0,0,d,0,0);let z=x.createLinearGradient(0,0,q.width,q.height);z.addColorStop(0,'#d8d8da');z.addColorStop(.5,'#afb1b4');z.addColorStop(1,'#d8d9da');x.fillStyle=z;x.fillRect(0,0,q.width,q.height);x.globalAlpha=.15;x.fillStyle='#fff';for(let y=8;y<q.height;y+=16)for(let a=8;a<q.width;a+=20){x.beginPath();x.arc(a,y,1.5,0,Math.PI*2);x.fill()}x.globalAlpha=1}function erase(e,X,Y){if(!e||done||e.classList.contains('open'))return;const v=e.querySelector('canvas'),q=v.getBoundingClientRect(),px=X-q.left,py=Y-q.top;if(px<0||py<0||px>q.width||py>q.height)return;const x=v.getContext('2d'),d=v.width/+v.dataset.w;x.save();x.setTransform(d,0,0,d,0,0);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(px,py,Math.max(16,q.width*.2),0,Math.PI*2);x.fill();x.restore()}function ratio(e){const v=e.querySelector('canvas'),a=v.getContext('2d').getImageData(0,0,v.width,v.height).data;let q=0,t=0;for(let i=3;i<a.length;i+=28){t++;if(a[i]<60)q++}return q/t}function op(e){let i=+e.dataset.i;if(o.has(i)||ratio(e)<.48)return;o.add(i);e.classList.add('open');e.querySelector('canvas').style.opacity=0;e.querySelector('canvas').style.pointerEvents='none';check()}function check(){for(const l of w){if(!l.every(i=>o.has(i)))continue;let s=c[l[0]].dataset.s;if(l.every(i=>c[i].dataset.s===s)){l.forEach(i=>c[i].classList.add('win'));done=true;setTimeout(show,600);return}}}function at(x,y){let e=document.elementFromPoint(x,y);return e&&e.closest('.cell')}g.onpointerdown=e=>{if(done)return;down=true;try{g.setPointerCapture(e.pointerId)}catch{}erase(at(e.clientX,e.clientY),e.clientX,e.clientY);e.preventDefault()};g.onpointermove=e=>{if(down&&!done){erase(at(e.clientX,e.clientY),e.clientX,e.clientY);e.preventDefault()}};g.onpointerup=g.onpointercancel=()=>{if(!down)return;down=false;c.forEach(op)};function show(){r.classList.add('show');let cols=['#6ab4e5','#f0a04a','#ffd46f','#a76eb5','#ed9ab9'];for(let i=0;i<60;i++){let n=document.createElement('i');n.className='conf';n.style.left=Math.random()*100+'vw';n.style.background=cols[i%5];n.style.setProperty('--x',(Math.random()-.5)*160+'px');n.style.setProperty('--d',(2+Math.random()*1.5)+'s');document.body.appendChild(n);setTimeout(()=>n.remove(),3800)}}cl.onclick=()=>r.classList.remove('show');c.forEach(paint);addEventListener('resize',()=>c.forEach(e=>{if(!e.classList.contains('open'))paint(e)}));</script></body></html>
