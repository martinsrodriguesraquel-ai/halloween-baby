<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1938">
<title>Raspadinha • Revelação do Bebê</title>
<style>
:root{--purple:#2b1938;--gold:#ffd36e;--blue:#6db7e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#211329}body{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#9e6ab344,transparent 24%),linear-gradient(#3c2148,#211329);overflow-x:hidden}.page{width:min(760px,100%);margin:auto;padding:6px}.poster{position:relative;width:100%;aspect-ratio:582/614;overflow:hidden;border:3px solid #3e2449;border-radius:26px;background:url('assets/reference.jpg') center/cover no-repeat;box-shadow:0 28px 90px #0008;isolation:isolate}.poster:after{content:"";position:absolute;inset:8px;border:2px dashed #a478ae77;border-radius:19px;pointer-events:none;z-index:40}.grid{position:absolute;left:21.5%;top:49.85%;width:57.2%;display:grid;grid-template-columns:repeat(3,1fr);gap:2.7%;z-index:20;touch-action:none}.cell{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:10%;overflow:hidden;background:#d2d3d4;box-shadow:0 3px 7px #0005;cursor:crosshair}.char{position:absolute;inset:0;background-image:url('assets/reference.jpg');background-repeat:no-repeat;background-size:310% auto;transform:scale(1.05);transition:transform .35s ease}.char.girl{background-position:1% 8%}.char.boy{background-position:99% 8%}.scratch{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none}.cell.open .char{transform:scale(1)}.cell.open{outline:3px solid #ffd36e;outline-offset:-3px}.cell.win{outline:5px solid #ffd36e;outline-offset:-5px;animation:winpulse .7s ease-in-out infinite alternate}@keyframes winpulse{to{transform:scale(1.035);filter:drop-shadow(0 0 9px #ffd36e)}}
.twinkle{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe8a8;box-shadow:0 0 10px #ffe8a8;z-index:10;pointer-events:none;animation:twinkle 2.2s ease-in-out infinite}.t1{left:8%;top:17%}.t2{right:8%;top:20%;animation-delay:.6s}.t3{left:11%;top:77%;animation-delay:1.1s}@keyframes twinkle{50%{opacity:.25;transform:scale(.65)}}.floatbat{position:absolute;z-index:10;font-size:22px;pointer-events:none;filter:drop-shadow(0 3px 2px #0003);animation:fly 4.2s ease-in-out infinite alternate}.fb1{left:3%;top:56%}.fb2{right:4%;top:69%;animation-delay:-1.4s}@keyframes fly{to{transform:translate(12px,-8px) rotate(7deg)}}
.reveal{position:fixed;inset:0;display:none;place-items:center;padding:18px;z-index:100;background:#211329eb;backdrop-filter:blur(8px)}.reveal.show{display:grid}.reveal-card{position:relative;width:min(560px,94vw);overflow:hidden;text-align:center;padding:24px 18px 26px;border-radius:30px;border:4px solid #9d72ad;background:radial-gradient(circle at 50% 8%,#fff8e8,#f6dfcf 70%);box-shadow:0 30px 100px #0008;animation:pop .7s cubic-bezier(.16,.9,.24,1.18)}@keyframes pop{from{opacity:0;transform:scale(.72) translateY(18px)}}.tag{display:inline-block;padding:8px 18px;border-radius:14px;background:#925eaa;color:#fff6eb;font-weight:900;letter-spacing:.06em}.reveal h1{margin:12px 0 10px;color:var(--blue);font-size:clamp(46px,10vw,82px);line-height:.93}.result-art{width:min(265px,68vw);aspect-ratio:1;margin:auto;border-radius:27px;border:5px solid #94cbee;background:url('assets/reference.jpg') 99% 8%/310% auto no-repeat;box-shadow:0 13px 35px #4b82ab44;animation:float 2.7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px) rotate(-1deg)}}.msg{margin-top:11px;color:#4c3157;font-size:clamp(19px,4vw,28px);font-weight:900}.sub{max-width:430px;margin:7px auto 0;color:#735b7b;font-weight:700;line-height:1.4}.close{margin-top:16px;border:0;border-radius:14px;padding:11px 18px;background:#ee9b46;color:#45264c;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #bd6b28}.confetti{position:fixed;top:-20px;width:8px;height:15px;border-radius:3px;z-index:120;animation:fall var(--dur) linear forwards;pointer-events:none}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(620deg);opacity:.2}}@media(max-width:560px){.page{padding:2px}.poster{border-radius:18px;border-width:2px}.poster:after{inset:5px;border-radius:12px}.grid{gap:2.5%}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="page"><section class="poster" aria-label="Raspadinha Halloween Baby"><i class="twinkle t1"></i><i class="twinkle t2"></i><i class="twinkle t3"></i><span class="floatbat fb1">🦇</span><span class="floatbat fb2">🦇</span><div class="grid" id="grid"></div></section></main>
<section class="reveal" id="reveal" role="dialog" aria-modal="true"><div class="reveal-card"><div class="tag">✨ O FEITIÇO REVELOU! ✨</div><h1>É UM MENINO! 💙</h1><div class="result-art" aria-label="Pequeno bruxinho"></div><div class="msg">Nosso pequeno bruxinho está a caminho! 🧙‍♂️</div><div class="sub">Vocês encontraram três bruxinhos na linha mágica. Agora o segredo está revelado! 🎃✨</div><button class="close" id="close" type="button">Ver o tabuleiro</button></div></section>
<script>
const pattern=['boy','girl','girl','girl','boy','girl','girl','boy','boy'];
const grid=document.getElementById('grid'),reveal=document.getElementById('reveal'),closeBtn=document.getElementById('close');
pattern.forEach((sex,i)=>{const b=document.createElement('button');b.className='cell';b.type='button';b.dataset.i=i;b.dataset.sex=sex;b.setAttribute('aria-label','Espaço '+(i+1)+' para raspar');b.innerHTML=`<div class="char ${sex}"></div><canvas class="scratch"></canvas>`;grid.appendChild(b)});
const cells=[...document.querySelectorAll('.cell')],wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],opened=new Set();let down=false,done=false;
function paint(c){const v=c.querySelector('canvas'),r=c.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));v.width=Math.round(r.width*d);v.height=Math.round(r.height*d);v.dataset.w=r.width;const x=v.getContext('2d');x.setTransform(d,0,0,d,0,0);const g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#d7d8da');g.addColorStop(.5,'#afb1b4');g.addColorStop(1,'#d8d9da');x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.globalAlpha=.13;x.fillStyle='#fff';for(let y=8;y<r.height;y+=16)for(let z=8;z<r.width;z+=20){x.beginPath();x.arc(z,y,1.5,0,Math.PI*2);x.fill()}x.globalAlpha=.16;x.font=Math.max(11,r.width*.13)+'px sans-serif';for(let y=22;y<r.height;y+=32)for(let z=12;z<r.width;z+=35)x.fillText((z+y)%2?'🎃':'✦',z,y);x.globalAlpha=1}
function erase(c,X,Y){if(!c||done||c.classList.contains('open'))return;const v=c.querySelector('canvas'),r=v.getBoundingClientRect(),px=X-r.left,py=Y-r.top;if(px<0||py<0||px>r.width||py>r.height)return;const x=v.getContext('2d'),d=v.width/parseFloat(v.dataset.w);x.save();x.setTransform(d,0,0,d,0,0);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(px,py,Math.max(18,r.width*.20),0,Math.PI*2);x.fill();x.restore()}
function ratio(c){const v=c.querySelector('canvas'),a=v.getContext('2d').getImageData(0,0,v.width,v.height).data;let q=0,t=0;for(let i=3;i<a.length;i+=28){t++;if(a[i]<60)q++}return q/t}
function openCell(c){const i=+c.dataset.i;if(opened.has(i)||ratio(c)<.48)return;opened.add(i);c.classList.add('open');const v=c.querySelector('canvas');v.style.transition='opacity .25s';v.style.opacity=0;v.style.pointerEvents='none';check()}
function check(){for(const l of wins){if(!l.every(i=>opened.has(i)))continue;const s=cells[l[0]].dataset.sex;if(l.every(i=>cells[i].dataset.sex===s)){l.forEach(i=>cells[i].classList.add('win'));done=true;setTimeout(showReveal,650);return}}}
function at(x,y){const e=document.elementFromPoint(x,y);return e&&e.closest('.cell')}
grid.addEventListener('pointerdown',e=>{if(done)return;down=true;try{grid.setPointerCapture(e.pointerId)}catch{}erase(at(e.clientX,e.clientY),e.clientX,e.clientY);e.preventDefault()});
grid.addEventListener('pointermove',e=>{if(down&&!done){erase(at(e.clientX,e.clientY),e.clientX,e.clientY);e.preventDefault()}});
function stop(){if(!down)return;down=false;cells.forEach(openCell)}grid.addEventListener('pointerup',stop);grid.addEventListener('pointercancel',stop);
function showReveal(){reveal.classList.add('show');const colors=['#6ab4e5','#f0a04a','#ffd46f','#a76eb5','#ed9ab9'];for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.setProperty('--x',(Math.random()-.5)*180+'px');c.style.setProperty('--dur',(2+Math.random()*1.8)+'s');document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}}
closeBtn.onclick=()=>reveal.classList.remove('show');cells.forEach(paint);addEventListener('resize',()=>cells.forEach(c=>{if(!c.classList.contains('open'))paint(c)}));
</script></body></html>
