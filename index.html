tion:absolute;width:22px;height:10px;z-index:3;opacity:.65;animation:fly var(--d) ease-in-out infinite alternate}.bat:before,.bat:after{content:"";position:absolute;top:1px;width:13px;height:9px;background:#25142b;border-radius:75% 12% 75% 18%}.bat:before{left:0;transform:rotate(20deg)}.bat:after{right:0;transform:scaleX(-1) rotate(20deg)}.b1{left:4%;top:57%;--d:3.2s}.b2{right:5%;top:71%;--d:4s}@keyframes fly{to{transform:translate(14px,-9px) rotate(6deg)}}.reveal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:18px;background:#211329eb;backdrop-filter:blur(8px)}.reveal.show{display:grid}.reveal-card{width:min(560px,95vw);text-align:center;padding:24px 18px 25px;border-radius:30px;border:4px solid #9d72ad;background:radial-gradient(circle at 50% 8%,#fff7df,#f5dfcf 68%);box-shadow:0 30px 100px #0007;animation:pop .7s cubic-bezier(.15,.9,.24,1.2)}@keyframes pop{from{opacity:0;transform:scale(.72) translateY(20px)}}.tag{display:inline-block;padding:8px 18px;border-radius:14px;background:#925eaa;color:#fff6eb;font-weight:900;letter-spacing:.06em}.reveal h1{margin:13px 0 10px;color:var(--blue);font-size:clamp(48px,10vw,82px);line-height:.93}.hero-result{width:min(260px,68vw);aspect-ratio:1;border-radius:26px;margin:auto;background-image:var(--art);background-repeat:no-repeat;background-size:300% auto;background-position:96% 9%;border:5px solid #94cbee;box-shadow:0 13px 35px #4b82ab44;animation:float 2.6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px) rotate(-1deg)}}.msg{margin-top:11px;color:#4c3157;font-size:clamp(19px,4vw,28px);font-weight:900}.sub{margin:7px auto 0;max-width:430px;color:#735b7b;font-weight:700;line-height:1.4}.close{margin-top:16px;border:0;border-radius:14px;padding:11px 18px;background:#ee9b46;color:#45264c;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #bd6b28}.confetti{position:fixed;top:-20px;width:8px;height:15px;border-radius:3px;z-index:120;animation:fall var(--dur) linear forwards;pointer-events:none}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(620deg);opacity:.2}}@media(max-width:560px){.page{padding:2px}.poster{border-radius:17px;border-width:2px}.poster:after{inset:5px;border-radius:12px}.grid{gap:2%}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="page"><section class="poster"><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="bat b1"></span><span class="bat b2"></span><div class="grid" id="grid"></div></section></main><section class="reveal" id="reveal"><div class="reveal-card"><div class="tag">✨ O FEITIÇO REVELOU! ✨</div><h1>É UM MENINO! 💙</h1><div class="hero-result" aria-label="Pequeno bruxinho"></div><div class="msg">Nosso pequeno bruxinho está a caminho! 🧙‍♂️</div><div class="sub">Vocês encontraram três bruxinhos na linha mágica. Agora o segredo está revelado! 🎃✨</div><button class="close" id="close">Ver o tabuleiro</button></div></section><script>
const pattern=['boy','girl','boy','girl','boy','girl','girl','boy','boy'];const grid=document.getElementById('grid'),reveal=document.getElementById('reveal'),closeBtn=document.getElementById('close');pattern.forEach((sex,i)=>{const b=document.createElement('button');b.className='cell';b.dataset.i=i;b.dataset.sex=sex;b.innerHTML=`<div class="char ${sex}"></div><canvas class="scratch"></canvas>`;grid.appendChild(b)});const cells=[...document.querySelectorAll('.cell')],wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],opened=new Set();let down=false,done=false;function paint(c){const v=c.querySelector('canvas'),r=c.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));v.width=Math.round(r.width*d);v.height=Math.round(r.height*d);v.dataset.w=r.width;const x=v.getContext('2d');x.setTransform(d,0,0,d,0,0);const g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#d6d7d8');g.addColorStop(.5,'#aeb0b3');g.addColorStop(1,'#d8d8da');x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.globalAlpha=.12;x.fillStyle='#fff';for(let y=8;y<r.height;y+=16)for(let z=8;z<r.width;z+=20){x.beginPath();x.arc(z,y,1.5,0,Math.PI*2);x.fill()}x.globalAlpha=.13;x.font=Math.max(11,r.width*.13)+'px sans-serif';for(let y=22;y<r.height;y+=32)for(let z=12;z<r.width;z+=35)x.fillText((z+y)%2?'🎃':'✦',z,y);x.globalAlpha=1}function erase(c,X,Y){if(!c||done||c.classList.contains('open'))return;const v=c.querySelector('canvas'),r=v.getBoundingClientRect(),px=X-r.left,py=Y-r.top;if(px<0||py<0||px>r.width||py>r.height)return;const x=v.getContext('2d'),d=v.width/parseFloat(v.dataset.w);x.save();x.setTransform(d,0,0,d,0,0);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(px,py,Math.max(18,r.width*.2),0,Math.PI*2);x.fill();x.restore()}function ratio(c){const v=c.querySelector('canvas'),a=v.getContext('2d').getImageData(0,0,v.width,v.height).data;let q=0,t=0;for(let i=3;i<a.length;i+=28){t++;if(a[i]<60)q++}return q/t}function openCell(c){const i=+c.dataset.i;if(opened.has(i)||ratio(c)<.48)return;opened.add(i);c.classList.add('open');const v=c.querySelector('canvas');v.style.transition='opacity .25s';v.style.opacity=0;v.style.pointerEvents='none';check()}function check(){for(const l of wins){if(!l.every(i=>opened.has(i)))continue;const s=cells[l[0]].dataset.sex;if(l.every(i=>cells[i].dataset.sex===s)){l.forEach(i=>cells[i].classList.add('win'));done=true;setTimeout(showReveal,650);return}}}function at(x,y){const e=document.elementFromPoint(x,y);return e&&e.closest('.cell')}grid.addEventListener('pointerdown',e=>{if(done)return;down=true;try{grid.setPointerCapture(e.pointerId)}catch{}erase(at(e.clientX,e.clientY),e.clientX,e.clientY);e.preventDefault()});grid.addEventListener('pointermove',e=>{if(down&&!done){erase(at(e.clientX,e.clientY),e.clientX,e.clientY);e.preventDefault()}});function stop(){if(!down)return;down=false;cells.forEach(openCell)}grid.addEventListener('pointerup',stop);grid.addEventListener('pointercancel',stop);function showReveal(){reveal.classList.add('show');const colors=['#6ab4e5','#f0a04a','#ffd46f','#a76eb5','#ed9ab9'];for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];c.style.setProperty('--x',(Math.random()-.5)*180+'px');c.style.setProperty('--dur',(2+Math.random()*1.8)+'s');document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}}closeBtn.onclick=()=>reveal.classList.remove('show');cells.forEach(paint);addEventListener('resize',()=>cells.forEach(c=>{if(!c.classList.contains('open'))paint(c)}));
</script></body></html>
